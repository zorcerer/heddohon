<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112" role="img" aria-label="Heddohon">
  <!--
    The same crest the application draws, on a tile of its own.

    A README image cannot inherit a colour from the page, and GitHub renders
    this against either a white or a near-black background, so the mark carries
    its own ground rather than hoping for one.
  -->
  <rect width="112" height="112" rx="30" fill="#17191d"/>
  <rect x="0.75" y="0.75" width="110.5" height="110.5" rx="29.25" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>
  <g transform="translate(24 24) scale(2)" fill="none" stroke="#cdd0d6">
    <circle cx="16" cy="16" r="13.6" stroke-width="1.8"/>
    <path d="M8.98 19.27A7.75 7.75 0 1 1 23.02 19.27" stroke-width="2.75" stroke-linecap="round"/>
  </g>
  <g transform="translate(24 24) scale(2)" fill="#cdd0d6">
    <rect x="6.62" y="17.9" width="4.72" height="8.3" rx="2.36"/>
    <rect x="20.66" y="17.9" width="4.72" height="8.3" rx="2.36"/>
  </g>
</svg>
