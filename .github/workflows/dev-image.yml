# Publishes `:dev` from every commit on the `dev` branch that passes `check`.
#
# `ghcr.io/zorcerer/heddohon:dev` and `zorcererd/heddohon:dev`, with
# `:dev-<short sha>` beside them so a report can name the exact build. The
# `dev` branch carries what the next release will be; `:latest` and the
# version tags still come only from release tags (`release.yml`).
#
# Runs after the `check` workflow finishes on a push to `dev`, and only when
# it succeeded, so the tag never points at a commit whose suites failed. A
# `workflow_run` workflow is read from the default branch, which is why this
# file is on `main` while the builds are of `dev`.
name: dev-image

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [dev]

permissions:
  contents: read
  packages: write

env:
  GHCR: ghcr.io/zorcerer/heddohon
  HUB: zorcererd/heddohon

jobs:
  image:
    # A pull request's run is not a commit on `dev`, and a failed run is not
    # published. The repository is checked as well as the event: a fork can
    # name its branch `dev`.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # A newer commit makes the build in progress moot. On the job, not the
    # workflow: a workflow-level group is joined before `if` is read, so the
    # `check` of any pull request from a branch named `dev` started a run
    # that cancelled the build in progress and then skipped itself. That left
    # 8c687f0, the head released as v0.3.0, without a `:dev` image.
    concurrency:
      group: dev-image
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # The token has `packages: write`; nothing after this step needs git.
          persist-credentials: false

      - name: Name the build
        id: version
        run: |
          short=$(git rev-parse --short HEAD)
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version package.json)-dev.$short" >> "$GITHUB_OUTPUT"

      # The version the app reports in its footer, the settings page and the
      # Jellyfin client header is package.json's, read at build time. A dev
      # build reports the last release with `-dev.<short sha>`, written there for
      # the build only.
      - name: Set the version in package.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for file in package.json package-lock.json; do
            jq --arg v "$VERSION" '.version = $v | if .packages then .packages[""].version = $v else . end' "$file" > "$file.tmp"
            mv "$file.tmp" "$file"
          done

      # The runtime stage runs as the target, which is arm64 half the time;
      # the build stage does not (see the Dockerfile).
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.GHCR }}:dev
            ${{ env.GHCR }}:dev-${{ steps.version.outputs.short }}
            ${{ env.HUB }}:dev
            ${{ env.HUB }}:dev-${{ steps.version.outputs.short }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max

      # Nothing in the build runs the arm64 image. Open a database in it, under
      # the same emulation, so an image that cannot load its native module is
      # reported here rather than by the first person to start it on a Pi.
      - name: Open a database in the arm64 image
        run: |
          docker run --rm --platform linux/arm64 -w /app "$GHCR:dev-${{ steps.version.outputs.short }}" \
            node -e "new (require('better-sqlite3'))(':memory:').prepare('select 1').get(); console.log(process.arch, 'ok')"
