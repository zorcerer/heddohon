# Publishes `:dev` from every commit on the `dev` branch that passes `check`.
#
# `ghcr.io/zorcerer/heddohon:dev` and `zorcererd/heddohon:dev`, with
# `:dev-<short sha>` beside them so a report can name the exact build. The
# `dev` branch carries what the next release will be; `:latest` and the
# version tags still come only from release tags (`release.yml`).
#
# Runs after the `check` workflow finishes on a push to `dev`, and only when
# it succeeded, so the tag never points at a commit whose suites failed. A
# `workflow_run` workflow is read from the default branch, which is why this
# file is on `main` while the builds are of `dev`.
name: dev-image

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [dev]

permissions:
  contents: read
  packages: write

# A newer commit makes the build in progress moot.
concurrency:
  group: dev-image
  cancel-in-progress: true

env:
  GHCR: ghcr.io/zorcerer/heddohon
  HUB: zorcererd/heddohon

jobs:
  image:
    # A pull request's run is not a commit on `dev`, and a failed run is not
    # published.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Name the build
        id: version
        run: |
          short=$(git rev-parse --short HEAD)
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version package.json)-dev.$short" >> "$GITHUB_OUTPUT"

      # The runtime stage runs as the target, which is arm64 half the time;
      # the build stage does not (see the Dockerfile).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.GHCR }}:dev
            ${{ env.GHCR }}:dev-${{ steps.version.outputs.short }}
            ${{ env.HUB }}:dev
            ${{ env.HUB }}:dev-${{ steps.version.outputs.short }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max

      # Nothing in the build runs the arm64 image. Open a database in it, under
      # the same emulation, so an image that cannot load its native module is
      # reported here rather than by the first person to start it on a Pi.
      - name: Open a database in the arm64 image
        run: |
          docker run --rm --platform linux/arm64 -w /app "$GHCR:dev-${{ steps.version.outputs.short }}" \
            node -e "new (require('better-sqlite3'))(':memory:').prepare('select 1').get(); console.log(process.arch, 'ok')"
