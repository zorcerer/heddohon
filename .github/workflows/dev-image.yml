# Publishes `:dev` from the head of the `dev` branch once a day, and when run
# by hand from the Actions tab.
#
# `ghcr.io/zorcerer/heddohon:dev` and `zorcererd/heddohon:dev`, with
# `:dev-<short sha>` beside them so a report can name the exact build. The
# `dev` branch carries what the next release will be; `:latest` and the
# version tags still come only from release tags (`release.yml`).
#
# Until 2026-09-29 it built from every push to `dev`, several images a day.
# The daily run builds only when the head has changed since the last build
# (there is no `:dev-<short sha>` for it yet). Either run builds only a commit
# whose `check` on the push to `dev` succeeded, so the tag never points at a
# commit whose suites failed. A scheduled or hand-started workflow is read
# from the default branch, which is why this file has to be on `main` to take
# effect while the builds are of `dev`.
name: dev-image

on:
  schedule:
    # 04:17 UTC. Off the hour, where GitHub queues scheduled runs longest.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  GHCR: ghcr.io/zorcerer/heddohon
  HUB: zorcererd/heddohon

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # To read the `check` runs of the commit.
      actions: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      sha: ${{ steps.plan.outputs.sha }}
      short: ${{ steps.plan.outputs.short }}
    steps:
      # `check` on the push that made this commit the head of `dev`. A pull
      # request's run is of a merge that is not on `dev`, so only a push
      # counts. A run still going, or none yet, is not a success either.
      - name: Decide whether to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/dev" -q .sha)
          short=${sha:0:7}
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          passed=$(gh run list -R "$GITHUB_REPOSITORY" --workflow check.yml --commit "$sha" --event push \
            --json conclusion -q '[.[] | select(.conclusion == "success")] | length')
          if [ "$passed" = "0" ]; then
            echo "::notice::check has not passed on $short; nothing built."
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "schedule" ] && docker buildx imagetools inspect "$GHCR:dev-$short" > /dev/null 2>&1; then
            echo "::notice::$short is already built; nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    # A run started by hand while the daily one is building waits for it.
    concurrency:
      group: dev-image
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      SHORT: ${{ needs.plan.outputs.short }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          # The token has `packages: write`; nothing after this step needs git.
          persist-credentials: false

      # The version the app reports in its footer, the settings page and the
      # Jellyfin client header is package.json's, read at build time. A dev
      # build reports the last release with `-dev.<short sha>`, written there for
      # the build only.
      - name: Set the version in package.json
        id: version
        run: |
          version="$(jq -r .version package.json)-dev.$SHORT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for file in package.json package-lock.json; do
            jq --arg v "$version" '.version = $v | if .packages then .packages[""].version = $v else . end' "$file" > "$file.tmp"
            mv "$file.tmp" "$file"
          done

      # The runtime stage runs as the target, which is arm64 half the time;
      # the build stage does not (see the Dockerfile).
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.GHCR }}:dev
            ${{ env.GHCR }}:dev-${{ env.SHORT }}
            ${{ env.HUB }}:dev
            ${{ env.HUB }}:dev-${{ env.SHORT }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max

      # Nothing in the build runs the arm64 image. Open a database in it, under
      # the same emulation, so an image that cannot load its native module is
      # reported here rather than by the first person to start it on a Pi.
      - name: Open a database in the arm64 image
        run: |
          docker run --rm --platform linux/arm64 -w /app "$GHCR:dev-$SHORT" \
            node -e "new (require('better-sqlite3'))(':memory:').prepare('select 1').get(); console.log(process.arch, 'ok')"
