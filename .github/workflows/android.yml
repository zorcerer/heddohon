# The Android app in `android/`: a Trusted Web Activity around a server
# someone runs.
#
# On a pull request that touches it, the unit tests and lint run and a debug
# APK is built and kept as an artifact of the run. Called from `release.yml`
# with a version, it builds the release APK as that version, signed with the
# release key from the repository's secrets, checks that the key is the one
# every server vouches for, and attaches `heddohon-<version>.apk` to the
# release.
name: android

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_call:
    inputs:
      version:
        description: The version the APK carries, without the v.
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE:
        description: The release keystore, base64.
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}-${{ inputs.version || 'pr' }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version || '0.0.0' }}
      RELEASE: ${{ inputs.version != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      # A pull request's build is signed with the runner's debug key: it
      # installs, and is not the app a server vouches for.
      - name: Build the debug APK
        if: env.RELEASE != 'true'
        run: |
          ./gradlew --no-daemon assembleDebug -PversionName="$VERSION"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/heddohon-$VERSION-debug.apk"

      - name: Build the release APK
        if: env.RELEASE == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          HEDDOHON_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HEDDOHON_ANDROID_KEYSTORE: ${{ runner.temp }}/release.jks
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$HEDDOHON_ANDROID_KEYSTORE"
          ./gradlew --no-daemon assembleRelease -PversionName="$VERSION"
          rm -f "$HEDDOHON_ANDROID_KEYSTORE"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/heddohon-$VERSION.apk"

      # The server names one key (`ANDROID_RELEASE_KEY` in `config.ts`). An APK
      # signed with another would open with an address bar on every server.
      - name: Check the APK is signed with the key the server vouches for
        if: env.RELEASE == 'true'
        run: |
          want=$(grep -oE "'([0-9A-F]{2}:){31}[0-9A-F]{2}'" ../src/lib/server/config.ts | head -1 | tr -d "':" | tr 'A-F' 'a-f')
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          got=$("$tools/apksigner" verify --print-certs "$RUNNER_TEMP/heddohon-$VERSION.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "server: $want"
          echo "apk:    $got"
          test -n "$want" && test "$want" = "$got"

      - uses: actions/upload-artifact@v4
        with:
          name: heddohon-android-${{ env.VERSION }}
          path: ${{ runner.temp }}/heddohon-*.apk
          if-no-files-found: error
          retention-days: 14

  # Its own job, so that only this step holds a token that can write.
  attach:
    if: inputs.version != ''
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: heddohon-android-${{ inputs.version }}
          path: packages

      - name: Attach to the release
        run: gh release upload "v$VERSION" "packages/heddohon-$VERSION.apk" --repo "$GITHUB_REPOSITORY" --clobber
