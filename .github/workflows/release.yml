name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  GHCR: ghcr.io/zorcerer/heddohon
  HUB: zorcererd/heddohon

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches package.json
        id: version
        run: |
          version=$(jq -r .version package.json)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The runtime stage runs as the target, which is arm64 half the time;
      # the build stage does not (see the Dockerfile).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Refuse to overwrite a published version
        run: |
          if docker buildx imagetools inspect "$GHCR:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "$GHCR:${{ steps.version.outputs.version }} is already published. Bump the version first." >&2
            exit 1
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.GHCR }}:${{ steps.version.outputs.version }}
            ${{ env.GHCR }}:latest
            ${{ env.HUB }}:${{ steps.version.outputs.version }}
            ${{ env.HUB }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Nothing in the build runs the arm64 image. Open a database in it, under
      # the same emulation, so an image that cannot load its native module is
      # reported here rather than by the first person to start it on a Pi.
      - name: Open a database in the arm64 image
        run: |
          docker run --rm --platform linux/arm64 -w /app "$GHCR:${{ steps.version.outputs.version }}" \
            node -e "new (require('better-sqlite3'))(':memory:').prepare('select 1').get(); console.log(process.arch, 'ok')"
