name: Release

# A release is made from `main`. Every push there works out the next version
# from the commit titles since the last `v*` tag (`.github/scripts/release-plan.mjs`:
# `feat` a minor release, `fix` and `perf` a patch, `!` a major one, anything
# else none). When there is one, the suites run, the image is published as that
# version and `latest`, and the tag and a GitHub release are created, with the
# notes from the titles and both compose files attached.
# `package.json` on `dev` is then set to the version (the `version` job).
#
# A `v*` tag pushed by hand is released as that version, as before. The tag
# this workflow creates does not start it again: a push made with the
# workflow's own token starts no workflow.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

# One release at a time, and none dropped: a second merge into `main` waits.
concurrency:
  group: release
  cancel-in-progress: false

env:
  GHCR: ghcr.io/zorcerer/heddohon
  HUB: zorcererd/heddohon

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit and tag since the last release, for the titles.
          fetch-depth: 0
          persist-credentials: false

      - name: Work out the version and the notes
        id: plan
        env:
          # To credit each entry to its author and pull request.
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            node .github/scripts/release-plan.mjs --tag "$GITHUB_REF_NAME"
          else
            node .github/scripts/release-plan.mjs
          fi

      - name: Say what will be released
        run: |
          if [[ "${{ steps.plan.outputs.release }}" == true ]]; then
            echo "### v${{ steps.plan.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
            cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing to release: no feat, fix or perf commit since the last tag." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.release == 'true'
        with:
          name: release-notes
          path: release-notes.md

  # The suites, on the commit being released, before anything is published.
  # v0.3.0 was published as `latest` while its tag's browser suite failed:
  # this ran beside `check`, not after it.
  check:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/check.yml

  image:
    needs: [plan, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The token has `packages: write`; nothing after this step needs git.
          persist-credentials: false

      # The version the app reports (`APP_VERSION`) is read from package.json
      # at build time. The release's version is written there for the build
      # only; the repository is not changed.
      - name: Set the version in package.json
        run: |
          for file in package.json package-lock.json; do
            jq --arg v "$VERSION" '.version = $v | if .packages then .packages[""].version = $v else . end' "$file" > "$file.tmp"
            mv "$file.tmp" "$file"
          done

      # The runtime stage runs as the target, which is arm64 half the time;
      # the build stage does not (see the Dockerfile).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Refuse to overwrite a published version
        run: |
          if docker buildx imagetools inspect "$GHCR:$VERSION" >/dev/null 2>&1; then
            echo "$GHCR:$VERSION is already published." >&2
            exit 1
          fi

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.GHCR }}:${{ env.VERSION }}
            ${{ env.GHCR }}:latest
            ${{ env.HUB }}:${{ env.VERSION }}
            ${{ env.HUB }}:latest
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Nothing in the build runs the arm64 image. Open a database in it, under
      # the same emulation, so an image that cannot load its native module is
      # reported here rather than by the first person to start it on a Pi.
      - name: Open a database in the arm64 image
        run: |
          docker run --rm --platform linux/arm64 -w /app "$GHCR:$VERSION" \
            node -e "new (require('better-sqlite3'))(':memory:').prepare('select 1').get(); console.log(process.arch, 'ok')"

  # After the image, so a release on GitHub always has one to pull.
  publish:
    needs: [plan, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      # For a tag pushed by hand the tag is there already and `--target` is
      # not used; otherwise this creates it on the released commit.
      #
      # `.env.example` goes up beside the compose files, which read `.env`:
      # the one at the released commit, which is `dev`'s as it was merged, so
      # it lists the variables this version has and no later ones. GitHub
      # renames an asset that starts with a dot to `default.env.example`, so
      # it is uploaded as `env.example` and labelled with its own name.
      - name: Create the release
        run: |
          cp .env.example env.example
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            docker-compose.yml docker-compose.dev.yml 'env.example#.env.example'

  # The desktop app for Linux and Windows, as this version, attached to the
  # release once it exists. A failure here leaves the release and its image as they are.
  desktop:
    needs: [plan, publish]
    permissions:
      contents: write
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      upload: true

  # The Android app, as this version and signed with the release key,
  # attached to the release once it exists. A failure here leaves the release
  # and its image as they are.
  android:
    needs: [plan, publish]
    permissions:
      contents: write
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.plan.outputs.version }}
    secrets:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

  # The repository's package.json follows the releases, so a `:dev` build,
  # which reports that version with `-dev.<short sha>`, counts on from the last
  # one. The commit goes to `dev` and reaches `main` with the next release. A
  # push made with this token starts no workflow, and a `chore` title releases
  # nothing.
  version:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - name: Set the version on dev
        run: |
          current=$(jq -r .version package.json)
          # A version set higher by hand stays.
          if [ "$(printf '%s\n' "$current" "$VERSION" | sort -V | tail -n 1)" = "$current" ]; then
            echo "dev is at $current, not below $VERSION"
            exit 0
          fi
          for file in package.json package-lock.json; do
            jq --tab --arg v "$VERSION" '.version = $v | if .packages then .packages[""].version = $v else . end' "$file" > "$file.tmp"
            mv "$file.tmp" "$file"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore: set the version to $VERSION"
          git push origin HEAD:dev
