name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  GHCR: ghcr.io/zorcerer/heddohon
  HUB: zorcererd/heddohon

jobs:
  # The suites, on the tagged commit, before anything is published. v0.3.0
  # was published as `latest` while its tag's browser suite failed: this ran
  # beside `check`, not after it.
  check:
    uses: ./.github/workflows/check.yml

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The token has `packages: write`; nothing after this step needs git.
          persist-credentials: false

      - name: Check tag matches package.json
        id: version
        run: |
          version=$(jq -r .version package.json)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The runtime stage runs as the target, which is arm64 half the time;
      # the build stage does not (see the Dockerfile).
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Refuse to overwrite a published version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$GHCR:$VERSION" >/dev/null 2>&1; then
            echo "$GHCR:$VERSION is already published. Bump the version first." >&2
            exit 1
          fi

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.GHCR }}:${{ steps.version.outputs.version }}
            ${{ env.GHCR }}:latest
            ${{ env.HUB }}:${{ steps.version.outputs.version }}
            ${{ env.HUB }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Nothing in the build runs the arm64 image. Open a database in it, under
      # the same emulation, so an image that cannot load its native module is
      # reported here rather than by the first person to start it on a Pi.
      - name: Open a database in the arm64 image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm --platform linux/arm64 -w /app "$GHCR:$VERSION" \
            node -e "new (require('better-sqlite3'))(':memory:').prepare('select 1').get(); console.log(process.arch, 'ok')"
