# `check` runs on every pull request and on every push to `dev` and `main`:
# `npm run check`, which is `svelte-kit sync` followed by
# `svelte-check --fail-on-warnings`, so a warning fails the job as well as an
# error. It also runs `npm audit` on the server's runtime dependencies, and a
# known vulnerability of high or critical severity in one of them fails the
# job; the tooling (`devDependencies`) is not audited, since none of it is in
# the image. It takes about 30 seconds. CodeQL is in `codeql.yml`.
#
# `test` builds the app and runs it against the mock music servers in
# `tests/`: the HTTP suite (`test:e2e`), the curl suite (`tests/e2e/run.sh`,
# which needs the curl and jq the runner image ships with) and the browser
# suite (`test:browser`) in Chromium. It takes about 12 minutes, and runs on a
# merge: a push to `dev` or `main`. It does not run for a pull request or
# for a push to any other branch. Until 2026-10-13 it ran for both, so each
# commit pushed to a pull request ran it twice. A branch is tested before it
# is merged by running the three suites where it was written, or by starting
# this workflow on it by hand (Actions, check, Run workflow), which runs both
# jobs. The image itself is built by the release workflow in
# zorcerer/heddohon, which calls this one and publishes only once both pass.
name: check

on:
  push:
    branches: [dev, main]
  pull_request:
  # Called by `release.yml`, which publishes only once these pass.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run moot.
concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # 22 to match `engines` in package.json and the Dockerfile's base image.
      # Where `.npmrc` sets `engine-strict`, `npm ci` refuses an older Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run check

      # The packages the image ships with. A finding of moderate or low
      # severity is printed and does not fail the job.
      - run: npm audit --omit=dev --audit-level=high

  test:
    # On a merge, a release and a run started by hand. Not for a pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The browser suite alone took about 13 minutes on a runner on 2026-11-07,
    # with the animated controls and the WebGL aurora.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run build

      # The ffmpeg sound analysis decodes with: the Dockerfile's `ffmpeg` stage
      # built for this runner, static, decoding a FLAC and an MP3 to the
      # samples the analysis reads. A few minutes of compiling. Before the
      # suites, which decode with the binary it leaves.
      - run: |
          HEDDOHON_FFMPEG_OUT="$RUNNER_TEMP/ffmpeg" tests/docker/ffmpeg.sh
          echo "HEDDOHON_TEST_FFMPEG=$RUNNER_TEMP/ffmpeg" >> "$GITHUB_ENV"

      - run: npm run test:e2e

      # Authentication, CSRF, media proxying, lyrics, playlists, shared links and
      # the regressions each security review added, on fixed ports 3322, 3323,
      # 4533 and 8096.
      - run: tests/e2e/run.sh

      # The image's entrypoint, in the image's base: who the server ends up
      # running as, and that it can write its data directory.
      - run: tests/docker/entrypoint.sh

      # The version installed is the one package-lock.json pins. Without
      # `--with-deps`: the runner image carries Chrome and the libraries it
      # needs, and the apt step `--with-deps` adds failed the job for hours on
      # 2026-11-11, when the runners could not resolve Ubuntu's mirrors.
      - run: npx playwright install chromium

      # `zbarimg` reads the TOTP QR code back in the two-step sign-in test;
      # without it that check is skipped, so a failed install does not fail
      # the job. Bounded: apt retries an unresolvable mirror for minutes.
      - run: sudo apt-get install -y --no-install-recommends zbar-tools
        continue-on-error: true
        timeout-minutes: 3

      - run: npm run test:browser
